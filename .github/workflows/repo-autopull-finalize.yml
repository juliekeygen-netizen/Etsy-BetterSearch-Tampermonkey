name: Finalize Repo AutoPull multi-command update

on:
  push:
    branches:
      - repo-autopull-multicommand
    paths:
      - tools/repo-autopull-update/**
      - .github/workflows/repo-autopull-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[autopull-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Apply Repo AutoPull v4 transformation
        run: python tools/repo-autopull-update/apply_v4.py

      - name: Audit transformed command flow
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'configVersion  = 4' Repo_AutoPull/Repo-AutoPull.ps1
          grep -F 'customCommands = @()' Repo_AutoPull/Repo-AutoPull.ps1
          grep -F '1. Add new command' Repo_AutoPull/Repo-AutoPull.ps1
          grep -F '4. Move command' Repo_AutoPull/Repo-AutoPull.ps1
          grep -F 'Push-Location $RepoPath' Repo_AutoPull/Repo-AutoPull.ps1
          grep -F 'for ($commandIndex = 0; $postSuccess -and $commandIndex -lt $commands.Count; $commandIndex++)' Repo_AutoPull/Repo-AutoPull.ps1

      - name: Build Windows x64 standalone EXE
        shell: bash
        run: |
          set -euo pipefail
          cp Repo_AutoPull/Repo-AutoPull.ps1 tools/repo-autopull-exe/embedded.ps1
          pushd tools/repo-autopull-exe
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../../Repo_AutoPull/RepoAutoPull.exe .
          popd
          rm -f tools/repo-autopull-exe/embedded.ps1
          test -s Repo_AutoPull/RepoAutoPull.exe

      - name: Commit generated script and EXE
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/repo-autopull-update
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Repo_AutoPull/Repo-AutoPull.ps1
          git add -f Repo_AutoPull/RepoAutoPull.exe
          git add -u tools/repo-autopull-update
          git commit -m 'feat: add ordered Repo AutoPull custom commands [autopull-finalize]'
          git push origin HEAD:repo-autopull-multicommand
