name: CI and extension builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run repository checks
        run: npm run check

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-output.txt
          if-no-files-found: error

      - name: Build Chrome and Firefox
        run: npm run build

      - name: Upload Chrome build
        uses: actions/upload-artifact@v4
        with:
          name: etsy-bettersearch-chrome
          path: dist/chrome
          if-no-files-found: error

      - name: Upload Firefox build
        uses: actions/upload-artifact@v4
        with:
          name: etsy-bettersearch-firefox
          path: dist/firefox
          if-no-files-found: error
