name: Finalize Repo AutoPull UI refinement

on:
  push:
    branches:
      - repo-autopull-ui-audit
    paths:
      - tools/repo-autopull-ui-update/**
      - .github/workflows/repo-autopull-ui-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[autopull-ui-finalize]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Apply UI refinement
        shell: pwsh
        run: python tools/repo-autopull-ui-update/apply_ui.py

      - name: Parse PowerShell and audit UI contracts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile('Repo_AutoPull/Repo-AutoPull.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          $source = Get-Content 'Repo_AutoPull/Repo-AutoPull.ps1' -Raw
          $required = @(
            'function Prompt-BooleanSetting',
            'function Prompt-ActionYesNo',
            'Change repository?',
            '-EnterMeaning "keep current repository"',
            '[1/4] Repository',
            '[2/4] Check interval',
            '[3/4] Post-pull commands',
            '[4/4] Launch after commands',
            'Manage custom commands?',
            '-EnterMeaning "keep current commands"',
            'Change selected file?',
            '-EnterMeaning "keep current file"',
            '1. Add new command',
            '2. Edit command',
            '3. Delete command',
            '4. Move command',
            'Current setup:',
            '1. Start monitoring',
            '2. Configure'
          )
          foreach ($needle in $required) {
            if (-not $source.Contains($needle)) { throw "Missing UI contract: $needle" }
          }
          if ($source.Contains('Prompt-YesNoSetting')) { throw 'Legacy Prompt-YesNoSetting still exists.' }
          Write-Host 'PowerShell parser + UI contract audit: OK'

      - name: Exercise custom command runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile('Repo_AutoPull/Repo-AutoPull.ps1', [ref]$tokens, [ref]$errors)
          $fn = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Invoke-CustomCommand' }, $true)
          if ($null -eq $fn) { throw 'Invoke-CustomCommand not found.' }
          Invoke-Expression $fn.Extent.Text

          $work = Join-Path $env:RUNNER_TEMP 'repo-autopull-command-test'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $ok = Invoke-CustomCommand -RepoPath $work -Command 'echo repo-cwd>command-proof.txt'
          if (-not $ok.Success) { throw "Successful command was reported failed: $($ok.Detail)" }
          $proof = Join-Path $work 'command-proof.txt'
          if (-not (Test-Path $proof)) { throw 'Custom command did not run in the supplied repository working directory.' }

          $fail = Invoke-CustomCommand -RepoPath $work -Command 'exit /b 7'
          if ($fail.Success -or $fail.ExitCode -ne 7) { throw "Failure exit-code handling is wrong: $($fail.ExitCode)" }
          $global:LASTEXITCODE = 0
          Write-Host 'Custom command CWD + exit-code audit: OK'

      - name: Audit ordered command execution and Git safety
        shell: pwsh
        run: |
          $source = Get-Content 'Repo_AutoPull/Repo-AutoPull.ps1' -Raw
          $required = @(
            'Push-Location $RepoPath',
            '$raw = @(& $commandProcessor /d /s /c $Command 2>&1)',
            'for ($commandIndex = 0; $postSuccess -and $commandIndex -lt $commands.Count; $commandIndex++)',
            '@("pull", "--ff-only", "--autostash", "--quiet")'
          )
          foreach ($needle in $required) {
            if (-not $source.Contains($needle)) { throw "Missing runtime contract: $needle" }
          }
          Write-Host 'Ordered commands + Git safety audit: OK'

      - name: Run repository CI
        shell: pwsh
        run: npm run ci

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          Copy-Item Repo_AutoPull/Repo-AutoPull.ps1 tools/repo-autopull-exe/embedded.ps1 -Force
          Push-Location tools/repo-autopull-exe
          try {
            go vet ./...
            if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }
            go build -buildvcs=false -trimpath -ldflags '-s -w' -o ../../Repo_AutoPull/RepoAutoPull.exe .
            if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          }
          finally {
            Pop-Location
            Remove-Item tools/repo-autopull-exe/embedded.ps1 -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path Repo_AutoPull/RepoAutoPull.exe)) { throw 'RepoAutoPull.exe was not built.' }
          Write-Host 'Standalone EXE build: OK'

      - name: Diff hygiene
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

      - name: Commit finalized UI and executable
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r tools/repo-autopull-ui-update
          git rm .github/workflows/repo-autopull-ui-finalize.yml
          git add Repo_AutoPull/Repo-AutoPull.ps1 Repo_AutoPull/README.txt
          git add -f Repo_AutoPull/RepoAutoPull.exe
          git commit -m 'refactor: improve Repo AutoPull configuration UI [autopull-ui-finalize]'
          git push origin HEAD:repo-autopull-ui-audit
